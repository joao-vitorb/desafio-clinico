# Configuração do Render (Blueprint). Cria um Web Service gratuito.
services:
  - type: web
    name: desafio-clinico
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PIN
        value: "2026"
      - key: HOST_KEY
        sync: false # o Render pede a senha do apresentador na criação
